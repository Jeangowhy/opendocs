<?xml version="1.0"?>
<svg width="400px" height="400px" version="1.1" 
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink">
    <style type="text/css">
    <![CDATA[
        rect { fill: silver; stroke: rgba(88, 38, 13, 0.29) }
    ]]>
    </style>
    <defs>
        <linearGradient id="Gradient01">
            <stop offset="20%" stop-color="#3399ff" />
            <stop offset="90%" stop-color="#ff33ff" />
        </linearGradient>
        <pattern id="grid" 
                    width="10" height="10"
                    patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="10" height="10" fill="lightgray" stroke="black"/>
        </pattern>
        <pattern id="checkbox" 
                    width="100" height="100"
                    patternUnits="userSpaceOnUse">
            <polyline points="0,100 0,50 100,50 100,-1 50,-1 50,100" transform="matrix(1,0,0,1,0,0)" fill="dark"/>
        </pattern>
    </defs>

    <text textLength="108.7" font-size="152.4" transform="matrix(1,0,0,1,0,0)" x="237" y="123" fill="url(#grid)"> H </text>
    <polyline points="0,100 0,50 100,50 100,-1 50,-1 50,100" fill="grey"/>
    <rect x="220" y="200" width="150" height="150" fill="url(#grid)" transform="matrix(1,0,0,1,0,0)" />
    <ellipse rx="84.5" ry="86.5" cx="90.5" cy="280.5" fill="url(#grid)"/>
</svg>
